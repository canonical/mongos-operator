[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.12.0"
ops = "~=3.8.1"
overrides = "*"
pymongo = "*"
pyyaml = "*"
jinja2 = "*"
poetry-core = ">=2.0"
rpds-py = "2026.6.3"
charm-refresh = ">=3.1.0.3,<4.0.0.0"
lightkube = "*"
pydantic = "*"  # cos_agent lib
cryptography = "*"  # tls_certificates lib v3
jsonschema = "*"  # tls_certificates lib v3
cosl = "*"  # loki_push_api
mongo-charms-single-kernel = "1.8.60"

[tool.poetry.group.build-refresh-version]
optional = true

[tool.poetry.group.build-refresh-version.dependencies]
charm-refresh-build-version = "^0.4.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.1.6"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.1.6"
codespell = "^2.2.6"

[tool.poetry.group.integration.dependencies]
lightkube = "^0.15.3"
allure-pytest = "^2.13.5"
ops = ">=2.21"
pymongo = "^4.7.3"
juju = "^3.5.0"
pytest = "^8.1.1"
pytest-asyncio ="^0.21.1"
pytest-operator = "^0.34.0"
mongo-charms-single-kernel = "1.8.60"

[build-system]
build-backend = "poetry.core.masonry.api"
