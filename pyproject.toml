[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.10.12"
mongo-charms-single-kernel = "0.0.11"
ops = "~2.23.0"
pymongo = "^4.13.2"
overrides = "^7.7.0"
tenacity = "^8.5.0"
pyyaml = "^6.0.2"
cffi = "^1.17.1"
jinja2= "^3.1.6"
pyOpenSSL = "^24.3.0"
pure-sasl = ">=0.6.2"
poetry-core = "^2.1.3"
rpds-py = "0.26.0"

[tool.poetry.group.charm-libs.dependencies]
ops = "~2.15.0"
pydantic ="*"
cryptography = "^42.0.5"
jsonschema = "^4.22.0"
cosl = "*"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.12.3"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.12.3"
codespell = "^2.4.1"

[tool.poetry.group.unit.dependencies]
mongo-charms-single-kernel = "0.0.11"
coverage = {extras = ["toml"], version = "^7.9.2"}
pytest = "^8.4.1"
pytest-mock = "*"
parameterized = "^0.9.0"
pymongo = "^4.13.2"

[tool.poetry.group.integration.dependencies]
mongo-charms-single-kernel = "0.0.11"
allure-pytest = "^2.14.3"
ops = "~2.23.0"
tenacity = "^8.5.0"
pymongo = "^4.13.2"
juju = "^3.5.0"
pytest = "^8.4.1"
pytest-asyncio ="^0.26.0"
pytest-operator = "^0.43.1"
pytest-operator-cache = {git = "https://github.com/canonical/data-platform-workflows", tag = "v29.0.0", subdirectory = "python/pytest_plugins/pytest_operator_cache"}
pytest-operator-groups = {git = "https://github.com/canonical/data-platform-workflows", tag = "v29.0.0", subdirectory = "python/pytest_plugins/pytest_operator_groups"}
allure-pytest-collection-report = {git = "https://github.com/canonical/data-platform-workflows", tag = "v29.0.0", subdirectory = "python/pytest_plugins/allure_pytest_collection_report"}

[build-system]
build-backend = "poetry.core.masonry.api"
