[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.12.0"
ops = "~=3.8.1"
overrides = "*"
pymongo = "*"
pyyaml = "*"
jinja2 = "*"
poetry-core = ">=2.4.1"
rpds-py = "2026.6.3"
charm-refresh = ">=3.1.1.6,<4.0.0.0"
lightkube = "*"
pydantic = "*"  # cos_agent lib
cryptography = "*"  # tls_certificates lib v3
jsonschema = "*"  # tls_certificates lib v3
cosl = "*"  # loki_push_api
mongo-charms-single-kernel = "1.8.61"

[tool.poetry.group.build-refresh-version]
optional = true

[tool.poetry.group.build-refresh-version.dependencies]
charm-refresh-build-version = "^0.4.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "^0.16.5"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.16.5"
codespell = "^2.4.3"

[tool.poetry.group.integration.dependencies]
lightkube = "^0.22.0"
allure-pytest = "^2.16.0"
ops = ">=2.23.4"
pymongo = "^4.17.0"
juju = "^3.5.0"
pytest = "^8.1.1"
pytest-asyncio ="^0.26.0"
pytest-operator = "^0.43.2"
mongo-charms-single-kernel = "1.8.61"

[build-system]
build-backend = "poetry.core.masonry.api"
